<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peer Element Binding => By id</title>
    <!-- #include virtual="/imports.html" -->
    <script type=module>
        import '/🪢.js';
    </script>
</head>
<body>
    <input id=search>

    ...
    
    <span id=span contenteditable 🪢='with #search.'></span>
    <div id=target></div>
    <script>
        function runTest(){
            span.textContent = 'hello';
            span.dispatchEvent(new Event('input'));
            setTimeout(() => {
                if(search.value === 'hello'){
                    target.setAttribute('mark', 'good')
                }
            }, 500);
        }
        setTimeout(() => {
            runTest();
        }, 1500);
    </script>
</body>
</html>
