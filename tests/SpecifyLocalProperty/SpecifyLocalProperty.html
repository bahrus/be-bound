<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peer Element Binding => Specify Local Property</title>
    <!-- #include virtual="/imports.html" -->
    <script type=module>
        import 'xtal-element/index.js';
        import '/🪢.js';
    </script>
</head>
<body>
    <label>
        <input name=howAmIFeeling>
    </label>
    <mood-stone enh-🪢="between currentMood and @howAmIFeeling">
        <template shadowrootmode=open>
            <div itemscope>
                <span itemprop=currentMood></span>
            </div>
            <xtal-element
                prop-defaults='{
                    "currentMood": "Happy"
                }'
                xform='{
                    "| currentMood": 0
                }'
            ></xtal-element>
            <be-hive></be-hive>
        </template>
    </mood-stone>

    <div id=target></div>
    <script>
        function runTest(){
            if(document.querySelector('input').value === 'Happy'){
                target.setAttribute('mark', 'good');
            }
        }
        setTimeout(() => {
            runTest();
        }, 1500);
    </script>
</body>
</html>
