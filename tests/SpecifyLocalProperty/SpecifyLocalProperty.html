<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peer Element Binding => Specify Local Property</title>
    <!-- #include virtual="/imports.html" -->
    <be-hive>
        <script type=emc-parser 
                src="be-hive/parsers/parse-pattern-statements.js" 
                parser-name=parse-pattern-statements></script>
        <script type=emc 
                src="be-bound/🪢.json" 
                wait-for-parsers=parse-pattern-statements></script>
    </be-hive>
    <script type=module>
        import 'xtal-element/index.js';
        import 'be-hive/be-hive.js';
    </script>
</head>
<body>
    <label>
        <input id=howAmIFeeling>
    </label>
    <mood-stone enh-🪢="between currentMood and #howAmIFeeling">
        <template shadowrootmode=open itemscope>
            <span itemprop=currentMood></span>
            <xtal-element
                prop-defaults='{
                    "currentMood": "Happy"
                }'
                xform='{
                    "| currentMood": 0
                }'
            ></xtal-element>
            <be-hive></be-hive>
        </template>
    </mood-stone>

    <div id=target></div>
    <script>
        function runTest(){
            if(document.querySelector('input').value === 'Happy'){
                target.setAttribute('mark', 'good');
            }
        }
        setTimeout(() => {
            runTest();
        }, 1500);
    </script>
</body>
</html>
