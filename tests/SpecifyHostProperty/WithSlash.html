<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Specify Host Property > With Slash</title>
    <!-- #include virtual="/imports.html" -->
    <script type=module>
        import 'xtal-element/index.js';
        import '/🪢.js';
    </script>
</head>
<body>
    <mood-stone>
        <template shadowrootmode=open  itemscope>
            <span itemprop=currentMood></span>
            <input 
                🪢="with ?.currentMood."
            >
            <xtal-element
                prop-defaults='{
                    "currentMood": "Happy"
                }'
                xform='{
                    "| currentMood": 0
                }'
            ></xtal-element>
            <be-hive></be-hive>
        </template>
    </mood-stone>
    <div id=target></div>
    <script>
        function runTest(){
            const rn = document.querySelector('mood-stone').shadowRoot;
            const input = rn.querySelector('input');
            input.value = 'hello';
            input.dispatchEvent(new Event('input'));
            setTimeout(() => {
                if(rn.querySelector('span').textContent === 'hello'){
                    target.setAttribute('mark', 'good')
                }
            }, 500);
        }
        setTimeout(() => {
            runTest();
        }, 1500);
    </script>
</body>
</html>
