<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peer Element Binding => Specify Local Property</title>
    <!-- #include virtual="/imports.html" -->
    <script type=module>
        import 'xtal-element/index.js';
        import '/🪢.js';
    </script>
</head>
<body>
    <label>
        <input id=howAmIFeeling>
    </label>
    <mood-stone enh-🪢="between currentMood and #howAmIFeeling">
        <template shadowrootmode=open itemscope>
            <span itemprop=currentMood></span>
            <xtal-element
                prop-defaults='{
                    "currentMood": "Happy"
                }'
                xform='{
                    "| currentMood": 0
                }'
            ></xtal-element>
            <be-hive></be-hive>
        </template>
    </mood-stone>


</body>
</html>
