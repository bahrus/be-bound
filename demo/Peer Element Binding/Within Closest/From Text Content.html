<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peer Element Binding => </title>
    <!-- #include virtual="/imports.html" -->
    <script type=module>
        import '/emc.js';
    </script>
</head>
<body>
    <section>
        Ignore this section
        <input name=search>
    </section>
    <section>
        Use this section
        <input name=search>
        ...
        <span contenteditable be-bound="with ^{section}@search.">
    </section>
</body>
</html>
