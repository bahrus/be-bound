<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peer Element Binding => </title>
    <!-- #include virtual="/imports.html" -->
    <script type=module>
        import 'xtal-element/index.js';
        import '/🪢.js';
    </script>
</head>
<body>
    <mood-stone -current-mood>
        <template shadowrootmode=open>
            <div itemscope>
                <span itemprop=currentMood></span>
            </div>
            <xtal-element
                prop-defaults='{
                    "currentMood": "Happy"
                }'
                xform='{
                    "| currentMood": 0
                }'
            ></xtal-element>
            <be-hive></be-hive>
        </template>
    </mood-stone>

    <input 🪢="with -current-mood">

</body>
</html>
