<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Programmatic declarative out of sequence</title>
    <!-- #include virtual="/imports.html" -->
</head>
<body>
    <input id=search>

    <span id=span contenteditable></span>
    <script type=module>
        import {defBeBound} from '/def.js';
        // set before the config is registered -- the spawn is deferred until defBeBound runs.
        span.enh.set.beBound.bindings = [{remoteId: 'search'}];
        await defBeBound(document.body);
        console.log(span.enh.beBound);
    </script>
</body>
</html>
